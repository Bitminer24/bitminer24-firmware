; BitMiner24 Firmware 2.0 — natives ESP-IDF 5 statt Arduino-Layer.
; Referenz und Begruendung: docs/FIRMWARE-2.0-PLAN.md im 1.x-Repo.

[platformio]
; IDF-Konvention: die Hauptkomponente heisst main/, nicht src/
src_dir = main

[env:bm24-v2]
platform = espressif32@6.12.0        ; pinned: ESP-IDF 5.5.0, GCC 14.2
framework = espidf
board = lilygo-t-display-s3
monitor_speed = 115200
board_build.partitions = partitions.csv
build_flags =
    -Wall
    -Wextra

; Host-Tests: reine Logik laeuft auf dem PC, ohne Hardware, in der CI.
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c11
    -Wall
    -Wextra
    -Icomponents/bm24_format/include
    -Icomponents/bm24_sha/include
    -Icomponents/bm24_sha_sw/include
    -Icomponents/bm24_work/include
